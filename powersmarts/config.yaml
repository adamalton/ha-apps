# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Powersmarts
version: "0.1.0"
slug: powersmarts
description: Poll a Powersmarts cloud URL and apply the desired state to Home Assistant devices.
url: https://github.com/adamalton/ha-apps
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:power-plug
panel_title: Powersmarts
panel_admin: true
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
